<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 让刘海屏的 safe-area 生效；interactive-widget 让软键盘压缩内容而不是顶飞布局 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="description" content="手机和电脑同步的极简时间记录工具" />

    <!-- 添加到主屏后以独立应用方式启动 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="时间记录" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>个人时间记录</title>
  </head>
  <body>
    <div id="root">
      <!-- JS 下载期间先显示稳定底色，避免主屏启动白屏 -->
      <div class="app-loading">时间记录</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
